# Native Actions egress firewall (technical preview).
# Docs: https://github.com/github-early-access/actions-native-egress-firewall
#
# Phase 2: mode: enforce — deny hosts outside `allow` (+ GitHub defaults).
# Allowlist derived from firewall-decisions-* artifacts after #535 (log) and
# verified under enforce on this PR (e.g. CI run 42946327623): Quality,
# React Doctor, Fallow. Defaults already cover github.com, codeload.github.com,
# *actions.githubusercontent.com, *blob.core.windows.net.
#
# This file is repo-editable. .github/CODEOWNERS requires @fringe4life review
# on changes. Technical preview has no org/enterprise egress ceiling yet —
# review + branch protection is the repo-side control (PR refs can still run
# with a widened policy until merge; tracked separately).
#
# Jobs need permissions.contents: read so the runner can load this file.
# Path is fixed: .github/egress-firewall.yaml (not under workflows/).
mode: enforce
allow:
  # Package registries / language tooling (Quality; CodeQL → PyPI)
  - registry.npmjs.org
  - pypi.org
  - files.pythonhosted.org

  # GitHub APIs / assets beyond defaults (API + release assets on CI;
  # pkg/uploads/copilot-proxy seen on master Varlock / tooling runs)
  - api.github.com
  - release-assets.githubusercontent.com
  - pkg.github.com
  - uploads.github.com
  - copilot-proxy.githubusercontent.com

  # Varlock + Bitwarden (Quality ph.varlock.dev; Bitwarden on master Varlock)
  - ph.varlock.dev
  - api.bitwarden.com
  - identity.bitwarden.com

  # Cloudflare (observed on Quality under enforce)
  - sparrow.cloudflare.com
  - workers.cloudflare.com

  # React Doctor telemetry (observed under enforce).
  #
  # Workaround: allow these hosts on the shared repo policy so every firewall
  # job (Quality, Fallow, …) can reach them — wrong long-term; only React Doctor
  # should. Native egress has one `.github/egress-firewall.yaml` per ref.
  #
  # Still required on Actions native egress firewall technical preview
  # (`ubuntu-24.04-firewall` + file-based enforce). Drop / narrow when upstream
  # ships per-job policy; re-verify Quality is denied Sentry and React Doctor
  # still reaches ingest.
  #
  # @see https://github.com/github-early-access/actions-native-egress-firewall/issues/31 — open
  # @see https://github.com/fringe4life/van-life/issues/543 — tracking
  # Socket ideal: per-job declarations inside a central ceiling (job may narrow, never widen).
  - www.react.doctor
  - api.axiom.co
  - firewall-api.socket.dev
  # Domain wildcard for rotating o*.ingest.us.sentry.io (not a pinned project host).
  - "*.ingest.us.sentry.io"
