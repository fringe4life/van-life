# Native Actions egress firewall (technical preview).
# Docs: https://github.com/github-early-access/actions-native-egress-firewall
#
# mode: log — record outbound DNS/HTTP(S); do not intentionally deny.
# After collecting artifacts/summaries from CI, switch to mode: enforce and
# extend `allow` with hosts the audit observed (plus GitHub defaults).
#
# Jobs using this file need permissions.contents: read (already set in our workflows).
# File path is fixed: .github/egress-firewall.yaml (not under workflows/).
mode: log
allow: []
