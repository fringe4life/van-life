# Audit workflow / Actions definitions (Socket Ch.4).
# Runs when .github/** changes; online audits use GITHUB_TOKEN.
name: Zizmor

on:
  pull_request:
    paths: [ ".github/**" ]
  push:
    branches: [ master ]
    paths: [ ".github/**" ]

permissions: {}

jobs:
  zizmor:
    name: Zizmor
    runs-on: ubuntu-latest
    cache-mode: read
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@v0.8.1
        with:
          online-audits: "true"
          token: ${{ github.token }}
          # SARIF → security tab (needs security-events: write)
          advanced-security: "true"
