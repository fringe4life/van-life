name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

# Default: least privilege. Jobs that need more declare their own permissions.
permissions:
  contents: read

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-24.04-firewall
    # Explicit read-only cache on PR/untrusted runs (also applies when this job runs on push).
    cache-mode: read
    permissions:
      contents: read
    # Loads committed .env.test via Varlock (no Bitwarden init)
    env:
      VARLOCK_ENV: test
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lockfile dedupe check
        run: bun run dedupe:check

      # Bare `bun audit` exits 0 even with printed vulns; severity floors make it fail (#540).
      # Prod tree: fail on low+ (--production). Full tree (incl. devDeps): high+ only
      # until ultracite/react-doctor transitive moderate/low noise clears.
      - name: Dependency audit
        run: bun run audit

      - name: Ultracite check
        run: bun run check

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

      - name: Assert no Panda cva runtime
        run: bun run assert:panda-cva

  # Real Bitwarden resolve — master push only (not PR).
  # VARLOCK_ENV=development enables .env.bitwarden import.
  varlock:
    name: Varlock
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04-firewall
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Load and validate env (Varlock)
        uses: dmno-dev/varlock-action@v1.0.5
        env:
          VARLOCK_ENV: development
          BITWARDEN_ACCESS_TOKEN: ${{ secrets.BITWARDEN_ACCESS_TOKEN }}

  # Sticky PR summary only: issues:write. Job check covers gate (blocking).
  # review-comments / commit-status off → no pull-requests or statuses write.
  react-doctor:
    name: React Doctor
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04-firewall
    cache-mode: read
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: React Doctor
        uses: millionco/react-doctor@v2.4.0
        with:
          scope: changed
          blocking: warning
          version: "0.9.14"
          comment: true
          review-comments: false
          commit-status: false

  # Soft gate: annotations only (no PR comment / review / Check Run writes).
  # fail-on-issues false until cleanup settles; Actions job status is the signal.
  fallow:
    name: Fallow
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04-firewall
    cache-mode: read
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fallow audit
        uses: fallow-rs/fallow@v3.42.0
        with:
          command: audit
          version: "3.27.0"
          score: true
          comment: false
          review-comments: false
          annotations: true
          fail-on-issues: false
          gate: new-only

      - name: Fallow security
        uses: fallow-rs/fallow@v3.42.0
        with:
          command: security
          version: "3.27.0"
          comment: false
          review-comments: false
          annotations: true
          fail-on-issues: false
